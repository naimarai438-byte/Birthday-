<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffd6e8, #d8e8ff);
        overflow: hidden;
    }

    .container {
        text-align: center;
    }

    h1 {
        color: #ff4081;
        font-size: 42px;
        margin-bottom: 10px;
    }

    .message {
        color: #555;
        font-size: 18px;
        margin-bottom: 35px;
    }

    .cake {
        position: relative;
        width: 280px;
        height: 220px;
        margin: auto;
    }

    /* Cake */
    .cake-top {
        position: absolute;
        width: 250px;
        height: 70px;
        background: #ff9fba;
        border-radius: 15px;
        left: 15px;
        top: 70px;
        box-shadow: 0 8px 0 #e87598;
    }

    .cake-bottom {
        position: absolute;
        width: 250px;
        height: 75px;
        background: #f58cae;
        border-radius: 0 0 18px 18px;
        left: 15px;
        top: 130px;
        box-shadow: 0 8px 0 #d96588;
    }

    .cream {
        position: absolute;
        width: 250px;
        height: 25px;
        background: white;
        border-radius: 15px;
        left: 15px;
        top: 125px;
    }

    /* Candles */
    .candle {
        position: absolute;
        width: 18px;
        height: 65px;
        background: repeating-linear-gradient(
            45deg,
            #ffffff,
            #ffffff 8px,
            #ff5c8a 8px,
            #ff5c8a 16px
        );
        border-radius: 5px;
        top: 10px;
    }

    .candle1 { left: 65px; }
    .candle2 { left: 130px; }
    .candle3 { left: 195px; }

    /* Flame */
    .flame {
        position: absolute;
        width: 22px;
        height: 32px;
        background: #ffb300;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        top: -28px;
        left: -2px;
        box-shadow: 0 0 15px #ff9800;
        animation: flicker 0.5s infinite alternate;
    }

    @keyframes flicker {
        from {
            transform: rotate(-45deg) scale(1);
        }
        to {
            transform: rotate(-45deg) scale(1.15);
        }
    }

    .blown {
        display: none;
    }

    button {
        margin-top: 35px;
        padding: 15px 28px;
        border: none;
        border-radius: 30px;
        background: #ff4081;
        color: white;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    button:active {
        transform: scale(0.95);
    }

    #status {
        margin-top: 15px;
        color: #555;
        font-size: 16px;
    }

    #wish {
        display: none;
        color: #ff4081;
        font-size: 25px;
        font-weight: bold;
        margin-top: 20px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🎉 Happy Birthday! 🎉</h1>

    <div class="message">
        Make a wish and blow the candles! 💨
    </div>

    <div class="cake">

        <div class="candle candle1">
            <div class="flame"></div>
        </div>

        <div class="candle candle2">
            <div class="flame"></div>
        </div>

        <div class="candle candle3">
            <div class="flame"></div>
        </div>

        <div class="cake-top"></div>
        <div class="cream"></div>
        <div class="cake-bottom"></div>

    </div>

    <button onclick="startMicrophone()">
        🎤 Start Microphone
    </button>

    <div id="status">
        Tap the button, then blow! 💨
    </div>

    <div id="wish">
        ✨ Wish made! Happy Birthday! 🎂✨
    </div>

</div>

<script>

let audioContext;
let analyser;
let microphone;
let blown = false;

async function startMicrophone() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioContext = new AudioContext();

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;

        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);

        document.getElementById("status").innerText =
            "🎤 Microphone ready! Blow on your phone! 💨";

        detectBlow();

    } catch (error) {

        document.getElementById("status").innerText =
            "❌ Microphone permission was denied.";

        console.log(error);
    }
}


function detectBlow() {

    const data = new Uint8Array(analyser.frequencyBinCount);

    function checkVolume() {

        analyser.getByteFrequencyData(data);

        let total = 0;

        for (let i = 0; i < data.length; i++) {
            total += data[i];
        }

        let volume = total / data.length;

        /*
        If the microphone detects a loud enough sound,
        the candles will go out.
        */

        if (volume > 45 && !blown) {
            blowCandles();
        }

        requestAnimationFrame(checkVolume);
    }

    checkVolume();
}


function blowCandles() {

    blown = true;

    const flames = document.querySelectorAll(".flame");

    flames.forEach(function(flame) {
        flame.style.display = "none";
    });

    document.getElementById("status").innerText =
        "💨 You blew out the candles!";

    document.getElementById("wish").style.display = "block";
}

</script>

</body>
</html>
